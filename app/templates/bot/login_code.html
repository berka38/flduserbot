{% extends "base.html" %}
{% from "bootstrap4/form.html" import render_form %}

{% block content %}
<div class="container mt-4">
    <h2>{{ _('Enter Verification Code') }}</h2>
    <p>{{ _('Please enter the Telegram verification code sent to') }} <strong>{{ phone }}</strong>.</p>
    <hr>
    <div class="row">
        <div class="col-md-6 offset-md-3">
            {{ render_form(form) }}
        </div>
    </div>
    <div class="mt-3">
        <a href="{{ url_for('bot.dashboard') }}" class="btn btn-secondary btn-sm">{{ _('Cancel and Return to Dashboard') }}</a>
        <!-- İleride 'Kodu Tekrar Gönder' özelliği eklenebilir -->
    </div>
</div>
{% endblock %}
