{% extends "base.html" %}
{% from "bootstrap5/form.html" import render_form %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h3><i class="fas fa-user-plus me-2"></i>{{ _('Register') }}</h3>
            <hr>
            {{ render_form(form) }}
            <div class="mt-3 text-center">
                <small>{{ _('Already have an account?') }} <a href="{{ url_for('auth.login') }}">{{ _('Login.') }}</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
